name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install -e .
      # 上游 7.4.0 自带测试回归(UPSTREAM.md 有记录):translate_refactor 8 项
      # (AttributeError: max_api_retries)+ incremental_cache 1 项(mock 缺 getProjectDir)
      - name: Run tests
        run: >
          python -m pytest tests/ -q
          --ignore=tests/test_translate_refactor_regressions.py
          --deselect tests/test_incremental_cache_append.py::IncrementalCacheAppendTests::test_batch_translate_saves_only_incremental_results
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
