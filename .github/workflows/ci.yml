name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # tests/test_translate_refactor_regressions.py 为上游 7.4.0 自带测试回归
      # (AttributeError: max_api_retries,tag 与 main 均存在),待向上游反馈后移除 ignore
      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/test_translate_refactor_regressions.py
        env:
          PYTHONIOENCODING: utf-8

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
