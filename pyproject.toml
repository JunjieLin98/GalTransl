[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galtrans-pipeline"
version = "0.1.0"
description = "galTrans — Galgame LLM 汉化流水线编排层(GalTransl fork)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
galtrans = "galtrans_pipeline.cli:main"

[tool.setuptools]
packages = ["galtrans_pipeline"]
